---
name: CI

'on':
  workflow_dispatch:
  push:
    branches:
      - 'ci-*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:

concurrency:
  # https://docs.github.com/en/actions/examples/using-concurrency-expressions-and-a-test-matrix
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') || github.ref != 'refs/heads/development' || github.ref != 'refs/heads/nextnet' || github.ref != 'refs/heads/stagenet' }}

permissions: {}

env:
  TARI_NETWORK: esmeralda

jobs:
  cargo-checks:
    name: Cargo checks (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create empty dist dir
        run: |
          mkdir dist

      - name: Install dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install dependencies (linux/OpenCL)
        run: |
          sudo apt-get install --no-install-recommends --assume-yes \
            opencl-headers \
            ocl-icd-opencl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: './src-tauri -> target'
          shared-key: tari-universe

      - name: Cargo format
        working-directory: ./src-tauri
        run: |
          cargo fmt --all -- --check

      - name: Build process-wrapper
        run: |
          cargo build --manifest-path process-wrapper/Cargo.toml
          cargo build --release --manifest-path process-wrapper/Cargo.toml

      - name: Clippy lint
        working-directory: ./src-tauri
        env:
          AIRDROP_BASE_URL: http://localhost:4000
          AIRDROP_API_BASE_URL: http://localhost:3004
          AIRDROP_TWITTER_AUTH_URL: http://localhost:3004/auth/twitter
          TELEMETRY_API_URL: http://localhost:3004
          EXCHANGE_ID: universal
        run: |
          cargo install cargo-lints
          cargo lints clippy --all-targets --all-features

      - name: Cargo check
        working-directory: ./src-tauri
        run: |
          cargo check --all-targets --workspace

  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-machete parses manifests only — no Rust toolchain or build
      # needed. Prebuilt static binary instead of `cargo install`, which
      # compiled from source for several minutes on every run.
      - name: Install cargo-machete
        run: |
          base_url=https://github.com/bnjbvr/cargo-machete/releases/download/v0.7.0
          curl -sSfLO "${base_url}/cargo-machete-v0.7.0-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfLO "${base_url}/cargo-machete-v0.7.0-x86_64-unknown-linux-musl.tar.gz.sha256"
          echo "$(cat cargo-machete-v0.7.0-x86_64-unknown-linux-musl.tar.gz.sha256)  cargo-machete-v0.7.0-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar xzf cargo-machete-v0.7.0-x86_64-unknown-linux-musl.tar.gz
          sudo install -m 755 cargo-machete-v0.7.0-x86_64-unknown-linux-musl/cargo-machete /usr/local/bin/cargo-machete

      - name: Cargo machete
        working-directory: ./src-tauri
        run: cargo-machete

  tauri-test-build:
    name: Tauri build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install dependencies (linux/OpenCL)
        run: |
          sudo apt-get install --no-install-recommends --assume-yes \
            opencl-headers \
            ocl-icd-opencl-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies (Node)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: './src-tauri -> target'
          shared-key: tari-universe

      - name: Build process-wrapper
        run: |
          cargo build --release --manifest-path process-wrapper/Cargo.toml

      # @tauri-apps/cli is already a devDependency — pnpm exec uses its
      # prebuilt binary instead of compiling tauri-cli from source (~10 min).
      - name: Tauri build
        working-directory: ./src-tauri
        run: |
          pnpm exec tauri --version
          pnpm exec tauri build --ci --no-bundle

  file-licenses:
    name: File licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Pinned release binary rather than apt, so the job doesn't fail whenever the runner
      # can't reach the Ubuntu mirrors. Unpacked outside the checkout, which rg scans.
      - name: Install ripgrep
        working-directory: ${{ runner.temp }}
        run: |
          archive=ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz
          curl -sSfLO "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/${archive}"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  ${archive}" | sha256sum -c -
          tar xzf "${archive}"
          sudo install -m 755 ripgrep-15.1.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          rg --version
      - name: Run the license check
        run: ./scripts/file_license_check.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create empty dist dir
        run: |
          mkdir dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: './src-tauri -> target'
          shared-key: tari-universe

      - name: Install dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libprotobuf-dev \
            protobuf-compiler

      - name: Install dependencies (linux/OpenCL)
        run: |
          sudo apt-get install --no-install-recommends --assume-yes \
            opencl-headers \
            ocl-icd-opencl-dev

      - name: Build process-wrapper
        run: |
          cargo build --release --manifest-path process-wrapper/Cargo.toml

      - name: Cargo test
        working-directory: ./src-tauri
        env:
          AIRDROP_BASE_URL: http://localhost:4000
          AIRDROP_API_BASE_URL: http://localhost:3004
          AIRDROP_TWITTER_AUTH_URL: http://localhost:3004/auth/twitter
          TELEMETRY_API_URL: http://localhost:3004
          EXCHANGE_ID: universal
        run: cargo test --locked --all-features --release

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test:coverage runs the full suite (vitest run --coverage) — a plain
      # `pnpm run test` first would just execute everything a second time.
      - name: Run frontend tests with coverage
        run: pnpm run test:coverage
