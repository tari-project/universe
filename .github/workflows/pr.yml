---
name: PR
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') || github.ref != 'refs/heads/development' || github.ref != 'refs/heads/nextnet' || github.ref != 'refs/heads/stagenet' }}

permissions: {}

jobs:
  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: 1Password/check-signed-commits-action@v1
  check-title:
    name: Check title
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Lint title
        env:
          PR_TITLE: ${{github.event.pull_request.title}}
        run: |
          echo "module.exports = {extends: ['@commitlint/config-conventional']}" > commitlint.config.js
          echo "$PR_TITLE" | pnpm dlx \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint
  check-i18n:
    name: Check i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stdlib only: an apt install here fails the job whenever the runner can't reach the
      # Ubuntu mirrors. Duplicate keys and NaN fail it, as they did under demjson's jsonlint.
      - name: Basic Jsonlint
        shell: python3 {0}
        run: |
          import json, pathlib, sys

          def no_duplicates(pairs):
              keys = [key for key, _ in pairs]
              duplicates = sorted({key for key in keys if keys.count(key) > 1})
              if duplicates:
                  raise ValueError(f"duplicate keys {duplicates}")
              return dict(pairs)

          def no_constants(name):
              raise ValueError(f"{name} is not valid JSON")

          failed = False
          for path in sorted(pathlib.Path("public").rglob("*")):
              if path.suffix.lower() != ".json" or not path.is_file():
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=no_duplicates, parse_constant=no_constants)
              except ValueError as error:
                  print(f"::error file={path}::{error}")
                  failed = True
          sys.exit(failed)

      - name: Setup folder for logs
        run: |
          mkdir -p ${{ runner.temp }}/i18n_logs

      - name: I18n compare
        continue-on-error: true
        working-directory: ./public/locales
        run: |
          python3 ../../scripts/i18n_checker.py \
            compare --en-locale-path en \
            --base-path . \
            --search-path .. \
            --output-dir ${{ runner.temp }}/i18n_logs

      - name: I18n unused
        continue-on-error: true
        working-directory: ./public/locales
        run: |
          python3 ../../scripts/i18n_checker.py \
            unused --en-locale-path en \
            --base-path . \
            --search-path .. \
            --output-dir ${{ runner.temp }}/i18n_logs

      - name: Artifact upload for i18n checks
        uses: actions/upload-artifact@v7
        with:
          name: i18n-logs
          path: ${{ runner.temp }}/i18n_logs
