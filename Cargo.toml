[workspace]
members = ["src-tauri", "process-wrapper"]
resolver = "2"

[profile.release]
debug = true

# minotari and tari-ootle take the tari crates from crates.io; resolve those to the
# same tagged tree as src-tauri so the wallet types line up with the app's.
[patch.crates-io]
minotari_app_grpc = { git = "https://github.com/tari-project/tari.git", tag = "v6.3.0-pre.2" }
minotari_ledger_wallet_common = { git = "https://github.com/tari-project/tari.git", tag = "v6.3.0-pre.2" }
minotari_node_grpc_client = { git = "https://github.com/tari-project/tari.git", tag = "v6.3.0-pre.2" }
minotari_node_wallet_client = { git = "https://github.com/tari-project/tari.git", tag = "v6.3.0-pre.2" }
